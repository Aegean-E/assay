[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "assay-evidence"
version = "0.2.0"
description = "Tamper-evident audit evidence for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-AL-1.1"
license-files = ["LICENSE"]
authors = [{name = "Aegean-E"}]
keywords = ["ai-agents", "audit", "compliance", "evidence", "governance", "hash-chain"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
assay = "assay.cli:entry"

[tool.setuptools.packages.find]
include = ["assay*"]

[tool.setuptools.package-data]
assay = ["py.typed", "packs/*.json"]
